<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Corridor - Fixed Controls</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            font-family: monospace;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff5555;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            top: 60px;
            left: 20px;
            color: #888;
            font-size: 12px;
            z-index: 10;
        }
        /* Virtual Joystick CSS */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }
        /* Action Buttons */
        .action-btn {
            position: absolute;
            bottom: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 16px;
            padding: 15px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        #run-btn {
            right: 140px;
            background: rgba(255, 165, 0, 0.3);
            border-color: rgba(255, 165, 0, 0.6);
        }
        #pick-btn {
            right: 30px;
            background: rgba(255, 85, 85, 0.3);
            border-color: rgba(255, 85, 85, 0.6);
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui">Keys Found: 0 / 3</div>
    <div id="controls-hint">Use left joystick to move, right screen to look!</div>

    <!-- Virtual Joystick -->
    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <!-- Buttons -->
    <div id="run-btn" class="action-btn">🏃‍♂️ RUN</div>
    <div id="pick-btn" class="action-btn">🔑 PICK</div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010101);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting (Thodi roshni badha di hai taaki black screen na lage)
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xffffff, 6, 30, Math.PI / 4, 0.4, 2);
        camera.add(flashlight);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -5);
        camera.add(flashlight.target);
        scene.add(camera);

        // 3. Open Room Environment
        const roomSize = 40;
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 });
        
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 5;
        scene.add(ceiling);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.8 });
        const wallHalf = roomSize / 2;
        
        scene.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(roomSize, 5, 1), wallMat), { position: { x: 0, y: 2.5, z: -wallHalf } }));
        scene.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(roomSize, 5, 1), wallMat), { position: { x: 0, y: 2.5, z: wallHalf } }));
        scene.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1, 5, roomSize), wallMat), { position: { x: -wallHalf, y: 2.5, z: 0 } }));
        scene.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1, 5, roomSize), wallMat), { position: { x: wallHalf, y: 2.5, z: 0 } }));

        // Pillars
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
        const pillarGeo = new THREE.BoxGeometry(2, 5, 2);
        [[-8,-8], [8,-8], [-8,8], [8,8]].forEach(p => {
            const mesh = new THREE.Mesh(pillarGeo, pillarMat);
            mesh.position.set(p[0], 2.5, p[1]);
            scene.add(mesh);
        });

        camera.position.set(0, 1.6, 15);

        // 4. Place 3 Keys
        const keys = [];
        const keyPositions = [{ x: -12, z: -12 }, { x: 12, z: -5 }, { x: 0, z: 12 }];
        const keyGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const keyMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });

        keyPositions.forEach((pos) => {
            const keyMesh = new THREE.Mesh(keyGeo, keyMat);
            keyMesh.position.set(pos.x, 1, pos.z);
            scene.add(keyMesh);
            keys.push({ mesh: keyMesh, collected: false });
        });

        // 5. Monster Setup
        const monsterGroup = new THREE.Group();
        const monsterBody = new THREE.Mesh(new THREE.BoxGeometry(1, 3.5, 1), new THREE.MeshStandardMaterial({ color: 0x1a0000 }));
        monsterBody.position.y = 1.75;
        monsterGroup.add(monsterBody);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat); leftEye.position.set(-0.2, 3.1, -0.5);
        const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat); rightEye.position.set(0.2, 3.1, -0.5);
        monsterGroup.add(leftEye); monsterGroup.add(rightEye);
        monsterGroup.position.set(0, 0, -15);
        scene.add(monsterGroup);

        // 6. Swipe Camera Controls (Right side of screen)
        let isSwiping = false;
        let prevTouchX = 0, prevTouchY = 0;
        let cameraRotationY = 0, cameraRotationX = 0;

        window.addEventListener('touchstart', (e) => {
            for (let t of e.touches) {
                if (t.clientX > window.innerWidth / 2) {
                    isSwiping = true;
                    prevTouchX = t.clientX;
                    prevTouchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            for (let t of e.touches) {
                if (t.clientX > window.innerWidth / 2) {
                    const deltaX = t.clientX - prevTouchX;
                    const deltaY = t.clientY - prevTouchY;

                    cameraRotationY -= deltaX * 0.005;
                    cameraRotationX -= deltaY * 0.005;
                    cameraRotationX = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraRotationX));

                    camera.rotation.order = 'YXZ';
                    camera.rotation.y = cameraRotationY;
                    camera.rotation.x = cameraRotationX;

                    prevTouchX = t.clientX;
                    prevTouchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchend', () => { isSwiping = false; });

        // 7. Fixed Virtual Joystick & Run Logic
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');
        let moveVector = { x: 0, y: 0 };
        let isRunning = false;
        let joystickTouchId = null;

        const runBtn = document.getElementById('run-btn');
        runBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isRunning = true; runBtn.style.background = 'rgba(255, 165, 0, 0.6)'; });
        runBtn.addEventListener('touchend', (e) => { e.preventDefault(); isRunning = false; runBtn.style.background = 'rgba(255, 165, 0, 0.3)'; });

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
        });

        window.addEventListener('touchmove', (e) => {
            if (joystickTouchId === null) return;
            let touch = null;
            for (let t of e.touches) {
                if (t.identifier === joystickTouchId) {
                    touch = t;
                    break;
                }
            }
            if (!touch) return;

            const rect = joystickBase.getBoundingClientRect();
            const baseCenterX = rect.left + rect.width / 2;
            const baseCenterY = rect.top + rect.height / 2;

            let deltaX = touch.clientX - baseCenterX;
            let deltaY = touch.clientY - baseCenterY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 40;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            moveVector.x = deltaX / maxRadius;
            moveVector.y = deltaY / maxRadius;
        });

        window.addEventListener('touchend', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    joystickStick.style.transform = `translate(0px, 0px)`;
                    moveVector.x = 0;
                    moveVector.y = 0;
                }
            }
        });

        // 8. Pick Key Logic
        let keysFound = 0;
        let currentNearbyKey = null;
        const pickBtn = document.getElementById('pick-btn');
        let gameOver = false;

        pickBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (currentNearbyKey && !currentNearbyKey.collected) {
                currentNearbyKey.collected = true;
                scene.remove(currentNearbyKey.mesh);
                keysFound++;
                document.getElementById('ui').innerText = `Keys Found: ${keysFound} / 3`;
                pickBtn.style.display = 'none';
                
                if(keysFound === 3) {
                    document.getElementById('ui').innerText = "YOU ESCAPED! 🎉";
                    gameOver = true;
                }
            }
        });

        // 9. Game Loop
        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            // Player Movement
            if (moveVector.y !== 0 || moveVector.x !== 0) {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();

                const sideDirection = new THREE.Vector3(-direction.z, 0, direction.x);
                const speed = isRunning ? 0.14 : 0.07;

                camera.position.addScaledVector(direction, -moveVector.y * speed);
                camera.position.addScaledVector(sideDirection, moveVector.x * speed);

                const limit = 18;
                camera.position.x = Math.max(-limit, Math.min(limit, camera.position.x));
                camera.position.z = Math.max(-limit, Math.min(limit, camera.position.z));
            }

            // Monster AI
            const monsterSpeed = 0.035;
            monsterGroup.lookAt(camera.position.x, monsterGroup.position.y, camera.position.z);
            monsterGroup.position.lerp(new THREE.Vector3(camera.position.x, 0, camera.position.z), monsterSpeed);

            if (monsterGroup.position.distanceTo(camera.position) < 1.8) {
                document.getElementById('ui').innerText = "CAUGHT BY MONSTER! 💀 GAME OVER";
                document.getElementById('ui').style.color = "red";
                gameOver = true;
            }

            // Check distance to keys
            currentNearbyKey = null;
            keys.forEach(k => {
                if (!k.collected) {
                    const distance = camera.position.distanceTo(k.mesh.position);
                    if (distance < 3) currentNearbyKey = k;
                }
            });

            pickBtn.style.display = currentNearbyKey ? 'block' : 'none';

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
