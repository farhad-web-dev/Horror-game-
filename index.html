<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Corridor - Advanced Horror</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            font-family: monospace;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff5555;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            top: 60px;
            left: 20px;
            color: #888;
            font-size: 12px;
            z-index: 10;
        }
        /* Virtual Joystick CSS */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }
        /* Action Buttons */
        .action-btn {
            position: absolute;
            bottom: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 16px;
            padding: 15px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            z-index: 10;
            display: none;
        }
        #run-btn {
            right: 140px;
            background: rgba(255, 165, 0, 0.3);
            border-color: rgba(255, 165, 0, 0.6);
            display: block !important;
        }
        #pick-btn {
            right: 30px;
            background: rgba(255, 85, 85, 0.3);
            border-color: rgba(255, 85, 85, 0.6);
        }
        #restart-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            background: #ff5555;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-family: monospace;
            cursor: pointer;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui">Keys Found: 0 / 3</div>
    <div id="controls-hint">Avoid the entity, find 3 keys & escape!</div>

    <!-- Virtual Joystick -->
    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <!-- Buttons -->
    <div id="run-btn" class="action-btn">🏃‍♂️ RUN</div>
    <div id="pick-btn" class="action-btn">🔑 PICK</div>
    <button id="restart-btn" onclick="location.reload()">PLAY AGAIN 🔄</button>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Scene, Camera, Renderer with Dark Atmospheric Fog
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010101);
        scene.fog = new THREE.FogExp2(0x010101, 0.085);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        
        renderer.domElement.style.position = 'fixed';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '1';
        document.body.appendChild(renderer.domElement);

        // 2. Lighting & Flashlight
        const ambientLight = new THREE.AmbientLight(0x0a0a0a);
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xffffff, 12, 28, Math.PI / 4, 0.4, 1.8);
        camera.add(flashlight);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -5);
        camera.add(flashlight.target);
        scene.add(camera);

        // 3. Multi-Room Maze Environment with Collision Boxes
        const roomSize = 40;
        const wallBoxes = []; // Collision storage

        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 5;
        scene.add(ceiling);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.7, metalness: 0.1 });
        const wallHalf = roomSize / 2;

        function createWall(w, h, d, x, y, z) {
            const geom = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geom, wallMat);
            mesh.position.set(x, y, z);
            scene.add(mesh);

            // Compute Bounding Box for Collision
            geom.computeBoundingBox();
            const box = new THREE.Box3();
            box.setFromObject(mesh);
            wallBoxes.push(box);
        }

        // Outer Boundaries
        createWall(roomSize, 5, 1, 0, 2.5, -wallHalf);
        createWall(roomSize, 5, 1, 0, 2.5, wallHalf);
        createWall(1, 5, roomSize, -wallHalf, 2.5, 0);
        createWall(1, 5, roomSize, wallHalf, 2.5, 0);

        // Inner Maze Walls (Granny Style Rooms)
        createWall(18, 5, 1, -11, 2.5, -5);
        createWall(1, 5, 14, -5, 2.5, 4);
        createWall(16, 5, 1, 10, 2.5, 5);
        createWall(1, 5, 12, 4, 2.5, -10);
        createWall(14, 5, 1, -2, 2.5, 12);

        camera.position.set(0, 1.6, 17);

        // 4. Place 3 Keys in Hidden Rooms
        const keys = [];
        const keyPositions = [
            { x: -16, z: -16 },
            { x: 16, z: -14 },
            { x: 0, z: 16 }
        ];
        const keyGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xff4500, emissiveIntensity: 0.9 });

        keyPositions.forEach((pos) => {
            const keyMesh = new THREE.Mesh(keyGeo, keyMat);
            keyMesh.position.set(pos.x, 1, pos.z);
            scene.add(keyMesh);
            keys.push({ mesh: keyMesh, collected: false });
        });

        // 5. Upgraded Creepy Monster Setup (Slender & Detailed)
        const monsterGroup = new THREE.Group();
        
        // Tall skeletal body
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.9, metalness: 0.2 });
        const monsterTorso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3.2, 0.6), bodyMat);
        monsterTorso.position.y = 1.8;
        monsterGroup.add(monsterTorso);

        // Sinister Head
        const monsterHead = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.7), bodyMat);
        monsterHead.position.y = 3.5;
        monsterGroup.add(monsterHead);

        // Glowing Red Eyes
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat); leftEye.position.set(-0.18, 3.6, -0.35);
        const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat); rightEye.position.set(0.18, 3.6, -0.35);
        monsterGroup.add(leftEye); monsterGroup.add(rightEye);

        // Long creepy arms
        const armGeo = new THREE.BoxGeometry(0.2, 2.5, 0.2);
        const leftArm = new THREE.Mesh(armGeo, bodyMat); leftArm.position.set(-0.6, 1.8, 0);
        const rightArm = new THREE.Mesh(armGeo, bodyMat); rightArm.position.set(0.6, 1.8, 0);
        monsterGroup.add(leftArm); monsterGroup.add(rightArm);

        monsterGroup.position.set(0, 0, -16);
        scene.add(monsterGroup);

        // 6. Swipe Camera Controls
        let isSwiping = false;
        let prevTouchX = 0, prevTouchY = 0;
        let cameraRotationY = 0, cameraRotationX = 0;

        window.addEventListener('touchstart', (e) => {
            for (let t of e.touches) {
                if (t.clientX > window.innerWidth / 2) {
                    isSwiping = true;
                    prevTouchX = t.clientX;
                    prevTouchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            for (let t of e.touches) {
                if (t.clientX > window.innerWidth / 2) {
                    const deltaX = t.clientX - prevTouchX;
                    const deltaY = t.clientY - prevTouchY;

                    cameraRotationY -= deltaX * 0.005;
                    cameraRotationX -= deltaY * 0.005;
                    cameraRotationX = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraRotationX));

                    camera.rotation.order = 'YXZ';
                    camera.rotation.y = cameraRotationY;
                    camera.rotation.x = cameraRotationX;

                    prevTouchX = t.clientX;
                    prevTouchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchend', () => { isSwiping = false; });

        // 7. Virtual Joystick & Run Logic
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');
        let moveVector = { x: 0, y: 0 };
        let isRunning = false;
        let joystickTouchId = null;

        const runBtn = document.getElementById('run-btn');
        runBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isRunning = true; runBtn.style.background = 'rgba(255, 165, 0, 0.7)'; });
        runBtn.addEventListener('touchend', (e) => { e.preventDefault(); isRunning = false; runBtn.style.background = 'rgba(255, 165, 0, 0.3)'; });

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
        });

        window.addEventListener('touchmove', (e) => {
            if (joystickTouchId === null) return;
            let touch = null;
            for (let t of e.touches) {
                if (t.identifier === joystickTouchId) {
                    touch = t;
                    break;
                }
            }
            if (!touch) return;

            const rect = joystickBase.getBoundingClientRect();
            const baseCenterX = rect.left + rect.width / 2;
            const baseCenterY = rect.top + rect.height / 2;

            let deltaX = touch.clientX - baseCenterX;
            let deltaY = touch.clientY - baseCenterY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 40;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            moveVector.x = deltaX / maxRadius;
            moveVector.y = deltaY / maxRadius;
        });

        window.addEventListener('touchend', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    joystickStick.style.transform = `translate(0px, 0px)`;
                    moveVector.x = 0;
                    moveVector.y = 0;
                }
            }
        });

        // 8. Pick Key Logic
        let keysFound = 0;
        let currentNearbyKey = null;
        const pickBtn = document.getElementById('pick-btn');
        let gameOver = false;

        pickBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (currentNearbyKey && !currentNearbyKey.collected) {
                currentNearbyKey.collected = true;
                scene.remove(currentNearbyKey.mesh);
                keysFound++;
                document.getElementById('ui').innerText = `Keys Found: ${keysFound} / 3`;
                pickBtn.style.display = 'none';
                
                if(keysFound === 3) {
                    document.getElementById('ui').innerText = "YOU ESCAPED! 🎉";
                    gameOver = true;
                    document.getElementById('restart-btn').style.display = 'block';
                }
            }
        });

        // 9. Game Loop with Collision Checking
        const playerRadius = 0.4;

        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            // Player Movement with Wall Collision Detection
            if (moveVector.y !== 0 || moveVector.x !== 0) {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();

                const sideDirection = new THREE.Vector3(-direction.z, 0, direction.x);
                const speed = isRunning ? 0.13 : 0.065;

                const potentialPosition = camera.position.clone();
                potentialPosition.addScaledVector(direction, -moveVector.y * speed);
                potentialPosition.addScaledVector(sideDirection, moveVector.x * speed);

                // Create a bounding box for player at potential position
                const playerBox = new THREE.Box3(
                    new THREE.Vector3(potentialPosition.x - playerRadius, 0, potentialPosition.z - playerRadius),
                    new THREE.Vector3(potentialPosition.x + playerRadius, 3, potentialPosition.z + playerRadius)
                );

                // Check collision against all walls
                let collision = false;
                for (let box of wallBoxes) {
                    if (box.intersectsBox(playerBox)) {
                        collision = true;
                        break;
                    }
                }

                // If no collision, update player position
                if (!collision) {
                    camera.position.copy(potentialPosition);
                }
            }

            // Monster AI Animation & Movement
            const monsterSpeed = 0.032 + (keysFound * 0.004);
            monsterGroup.lookAt(monsterGroup.position.x, monsterGroup.position.y, camera.position.x);
            monsterGroup.position.lerp(new THREE.Vector3(camera.position.x, 0, camera.position.z), monsterSpeed);

            // Subtle eerie floating effect for monster head
            monsterHead.position.y = 3.5 + Math.sin(Date.now() * 0.005) * 0.1;

            if (monsterGroup.position.distanceTo(camera.position) < 1.8) {
                document.getElementById('ui').innerText = "CAUGHT BY THE ENTITY! 💀 GAME OVER";
                document.getElementById('ui').style.color = "red";
                gameOver = true;
                document.getElementById('restart-btn').style.display = 'block';
            }

            // Check distance to keys
            currentNearbyKey = null;
            keys.forEach(k => {
                if (!k.collected) {
                    const distance = camera.position.distanceTo(k.mesh.position);
                    if (distance < 2.5) currentNearbyKey = k;
                }
            });

            pickBtn.style.display = currentNearbyKey ? 'block' : 'none';

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
