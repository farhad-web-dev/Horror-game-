<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Corridor - Monster Horror</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            font-family: monospace;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff5555;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            top: 60px;
            left: 20px;
            color: #888;
            font-size: 12px;
            z-index: 10;
        }
        /* Virtual Joystick CSS */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        /* Pick Button CSS */
        #pick-btn {
            position: absolute;
            bottom: 50px;
            right: 40px;
            background: rgba(255, 85, 85, 0.3);
            border: 2px solid rgba(255, 85, 85, 0.6);
            color: white;
            font-size: 16px;
            padding: 15px 25px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui">Keys Found: 0 / 3</div>
    <div id="controls-hint">Avoid the monster & find keys!</div>

    <!-- Virtual Joystick -->
    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <!-- Pick Button -->
    <div id="pick-btn">🔑 PICK KEY</div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010101);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting & Flashlight
        const ambientLight = new THREE.AmbientLight(0x050505);
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xffffff, 6, 30, Math.PI / 4, 0.4, 2);
        camera.add(flashlight);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -5);
        camera.add(flashlight.target);
        scene.add(camera);

        // 3. Open World Room Building
        const roomSize = 40;
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 });
        
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomSize, roomSize), floorMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 5;
        scene.add(ceiling);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.8 });
        const wallHalf = roomSize / 2;
        
        const northWall = new THREE.Mesh(new THREE.BoxGeometry(roomSize, 5, 1), wallMat);
        northWall.position.set(0, 2.5, -wallHalf);
        scene.add(northWall);

        const southWall = new THREE.Mesh(new THREE.BoxGeometry(roomSize, 5, 1), wallMat);
        southWall.position.set(0, 2.5, wallHalf);
        scene.add(southWall);

        const westWall = new THREE.Mesh(new THREE.BoxGeometry(1, 5, roomSize), wallMat);
        westWall.position.set(-wallHalf, 2.5, 0);
        scene.add(westWall);

        const eastWall = new THREE.Mesh(new THREE.BoxGeometry(1, 5, roomSize), wallMat);
        eastWall.position.set(wallHalf, 2.5, 0);
        scene.add(eastWall);

        // Pillars
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
        const pillarGeo = new THREE.BoxGeometry(2, 5, 2);
        scene.add(Object.assign(new THREE.Mesh(pillarGeo, pillarMat), { position: new THREE.Vector3(-8, 2.5, -8) }));
        scene.add(Object.assign(new THREE.Mesh(pillarGeo, pillarMat), { position: new THREE.Vector3(8, 2.5, -8) }));
        scene.add(Object.assign(new THREE.Mesh(pillarGeo, pillarMat), { position: new THREE.Vector3(-8, 2.5, 8) }));
        scene.add(Object.assign(new THREE.Mesh(pillarGeo, pillarMat), { position: new THREE.Vector3(8, 2.5, 8) }));

        camera.position.set(0, 1.6, 15);

        // 4. Place 3 Keys
        const keys = [];
        const keyPositions = [
            { x: -12, z: -12 },
            { x: 12, z: -5 },
            { x: 0, z: 12 }
        ];

        const keyGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const keyMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });

        keyPositions.forEach((pos) => {
            const keyMesh = new THREE.Mesh(keyGeo, keyMat);
            keyMesh.position.set(pos.x, 1, pos.z);
            scene.add(keyMesh);
            keys.push({ mesh: keyMesh, collected: false });
        });

        // 5. Monster Setup (Scary Red Glowing Figure)
        const monsterGeo = new THREE.BoxGeometry(1, 3.5, 1);
        const monsterMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const monster = new THREE.Mesh(monsterGeo, monsterMat);
        monster.position.set(0, 1.75, -12);
        scene.add(monster);
        let monsterAlive = true;

        // 6. Swipe Camera Controls (Right side)
        let isSwiping = false;
        let prevTouchX = 0, prevTouchY = 0;
        let cameraRotationY = 0, cameraRotationX = 0;

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX > window.innerWidth / 2) {
                    isSwiping = true;
                    prevTouchX = e.touches[i].clientX;
                    prevTouchY = e.touches[i].clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX > window.innerWidth / 2) {
                    const deltaX = e.touches[i].clientX - prevTouchX;
                    const deltaY = e.touches[i].clientY - prevTouchY;

                    cameraRotationY -= deltaX * 0.005;
                    cameraRotationX -= deltaY * 0.005;
                    cameraRotationX = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraRotationX));

                    camera.rotation.order = 'YXZ';
                    camera.rotation.y = cameraRotationY;
                    camera.rotation.x = cameraRotationX;

                    prevTouchX = e.touches[i].clientX;
                    prevTouchY = e.touches[i].clientY;
                }
            }
        });

        window.addEventListener('touchend', () => { isSwiping = false; });

        // 7. Virtual Joystick Movement Logic
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');
        let joystickActive = false;
        let moveVector = { x: 0, y: 0 };
        let baseCenterX = 0, baseCenterY = 0;

        joystickBase.addEventListener('touchstart', (e) => {
            joystickActive = true;
            const rect = joystickBase.getBoundingClientRect();
            baseCenterX = rect.left + rect.width / 2;
            baseCenterY = rect.top + rect.height / 2;
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            let touch = null;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].clientX < window.innerWidth / 2) {
                    touch = e.touches[i];
                    break;
                }
            }
            if (!touch) return;

            let deltaX = touch.clientX - baseCenterX;
            let deltaY = touch.clientY - baseCenterY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 40;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }

            joystickStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            moveVector.x = deltaX / maxRadius;
            moveVector.y = deltaY / maxRadius;
        });

        window.addEventListener('touchend', () => {
            joystickActive = false;
            joystickStick.style.transform = `translate(0px, 0px)`;
            moveVector.x = 0;
            moveVector.y = 0;
        });

        // 8. Pick Key Logic
        let keysFound = 0;
        let currentNearbyKey = null;
        const pickBtn = document.getElementById('pick-btn');

        pickBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (currentNearbyKey && !currentNearbyKey.collected) {
                currentNearbyKey.collected = true;
                scene.remove(currentNearbyKey.mesh);
                keysFound++;
                document.getElementById('ui').innerText = `Keys Found: ${keysFound} / 3`;
                pickBtn.style.display = 'none';
                
                if(keysFound === 3) {
                    monsterAlive = false;
                    scene.remove(monster);
                    document.getElementById('ui').innerText = "YOU ESCAPED! 🎉";
                }
            }
        });

        // 9. Game Loop with Monster AI & Boundaries
        function animate() {
            requestAnimationFrame(animate);

            if (moveVector.y !== 0 || moveVector.x !== 0) {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();

                const sideDirection = new THREE.Vector3(-direction.z, 0, direction.x);

                const speed = 0.08;
                camera.position.addScaledVector(direction, -moveVector.y * speed);
                camera.position.addScaledVector(sideDirection, moveVector.x * speed);

                const limit = 18;
                camera.position.x = Math.max(-limit, Math.min(limit, camera.position.x));
                camera.position.z = Math.max(-limit, Math.min(limit, camera.position.z));
            }

            // Monster movement towards player (AI)
            if (monsterAlive) {
                const monsterSpeed = 0.035;
                monster.position.lerp(camera.position, monsterSpeed);
                monster.position.y = 1.75; // Height fix

                // Check distance between player and monster (Jumpscare / Game Over)
                const distanceToMonster = camera.position.distanceTo(monster.position);
                if (distanceToMonster < 1.5) {
                    document.getElementById('ui').innerText = "YOU DIED! 💀 (Monster got you)";
                    monsterAlive = false;
                    scene.remove(monster);
                }
            }

            // Check distance to keys
            currentNearbyKey = null;
            keys.forEach(k => {
                if (!k.collected) {
                    const distance = camera.position.distanceTo(k.mesh.position);
                    if (distance < 3) {
                        currentNearbyKey = k;
                    }
                }
            });

            if (currentNearbyKey && keysFound < 3) {
                pickBtn.style.display = 'block';
            } else {
                pickBtn.style.display = 'none';
            }

            renderer.render(scene, camera);
        }
        animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
