<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Corridor - 3D Horror</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            font-family: monospace;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff5555;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        /* On-screen Action Buttons */
        .game-btn {
            position: absolute;
            bottom: 30px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 18px;
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            user-select: none;
            z-index: 10;
            text-align: center;
        }
        #walk-btn {
            left: 30px;
        }
        #pick-btn {
            right: 30px;
            background: rgba(255, 85, 85, 0.3);
            border-color: rgba(255, 85, 85, 0.6);
            display: none; /* Sirf tab dikhega jab key ke paas honge */
        }
        #controls-hint {
            position: absolute;
            top: 60px;
            left: 20px;
            color: #888;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">Keys Found: 0 / 3</div>
    <div id="controls-hint">Swipe screen to look around</div>

    <div id="walk-btn" class="game-btn">🚶‍♂️ HOLD TO WALK</div>
    <div id="pick-btn" class="game-btn">🔑 PICK KEY</div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting & Flashlight
        const ambientLight = new THREE.AmbientLight(0x080808);
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xffffff, 6, 25, Math.PI / 5, 0.4, 2);
        camera.add(flashlight);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -5);
        camera.add(flashlight.target);
        scene.add(camera);

        // 3. Corridor Building
        const corridorLength = 60;
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
        
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, corridorLength), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, 0, -corridorLength / 2 + 10);
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(8, corridorLength), floorMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(0, 4, -corridorLength / 2 + 10);
        scene.add(ceiling);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.8 });
        
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 4, corridorLength), wallMat);
        leftWall.position.set(-4, 2, -corridorLength / 2 + 10);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, 4, corridorLength), wallMat);
        rightWall.position.set(4, 2, -corridorLength / 2 + 10);
        scene.add(rightWall);

        camera.position.set(0, 1.6, 10);

        // 4. Place 3 Keys inside the Corridor (Glowing spheres representing keys)
        const keys = [];
        const keyPositions = [
            { x: -2, z: -5 },
            { x: 2, z: -20 },
            { x: 0, z: -40 }
        ];

        const keyGeo = new THREE.SphereGeometry(0.3, 16, 16);
        const keyMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });

        keyPositions.forEach((pos, index) => {
            const keyMesh = new THREE.Mesh(keyGeo, keyMat);
            keyMesh.position.set(pos.x, 1, pos.z);
            scene.add(keyMesh);
            keys.push({ mesh: keyMesh, collected: false });
        });

        // 5. Touch & Swipe Look Controls (Only on empty screen space)
        let isTouching = false;
        let prevTouchX = 0;
        let prevTouchY = 0;
        let cameraRotationY = 0;
        let cameraRotationX = 0;

        window.addEventListener('touchstart', (e) => {
            // Agar button touch nahi kiya, tabhi camera swipe hoga
            if(e.target.tagName === 'BODY' || e.target.id === 'controls-hint') {
                isTouching = true;
                prevTouchX = e.touches[0].clientX;
                prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;

            const deltaX = currentX - prevTouchX;
            const deltaY = currentY - prevTouchY;

            cameraRotationY -= deltaX * 0.005;
            cameraRotationX -= deltaY * 0.005;
            cameraRotationX = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraRotationX));

            camera.rotation.order = 'YXZ';
            camera.rotation.y = cameraRotationY;
            camera.rotation.x = cameraRotationX;

            prevTouchX = currentX;
            prevTouchY = currentY;
        });

        window.addEventListener('touchend', () => { isTouching = false; });

        // 6. Walk Button Logic
        let isWalking = false;
        const walkBtn = document.getElementById('walk-btn');
        walkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isWalking = true; });
        walkBtn.addEventListener('touchend', (e) => { e.preventDefault(); isWalking = false; });

        // 7. Pick Key Logic
        let keysFound = 0;
        let currentNearbyKey = null;
        const pickBtn = document.getElementById('pick-btn');

        pickBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (currentNearbyKey && !currentNearbyKey.collected) {
                currentNearbyKey.collected = true;
                scene.remove(currentNearbyKey.mesh);
                keysFound++;
                document.getElementById('ui').innerText = `Keys Found: ${keysFound} / 3`;
                pickBtn.style.display = 'none';
                
                if(keysFound === 3) {
                    document.getElementById('ui').innerText = "YOU ESCAPED! 🎉";
                }
            }
        });

        // 8. Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Move forward when Walk button is held
            if (isWalking) {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();
                camera.position.addScaledVector(direction, 0.06);
            }

            // Check distance to keys for pickup
            currentNearbyKey = null;
            keys.forEach(k => {
                if (!k.collected) {
                    const distance = camera.position.distanceTo(k.mesh.position);
                    if (distance < 2.5) { // Agar 2.5 meter ke paas hai toh key uthane ka button dikhega
                        currentNearbyKey = k;
                    }
                }
            });

            if (currentNearbyKey) {
                pickBtn.style.display = 'block';
            } else {
                pickBtn.style.display = 'none';
            }

            renderer.render(scene, camera);
        }
        animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
